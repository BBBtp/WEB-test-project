version: '3.7'

services:
  postgres:
    image: postgres:15-alpine
    container_name: wells_postgres
    environment:
      POSTGRES_DB: wells
      POSTGRES_USER: wells_user
      POSTGRES_PASSWORD: 1
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      - "5455:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wells_user -d wells"]
      interval: 10s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: minio_wells
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: wells_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  web:
    build: .
    container_name: wells_web
    ports:
      - "8000:8000"
      - "8443:8443"
    environment:
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=wells
      - DB_USER=wells_user
      - DB_PASSWORD=1
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - SECURE_SSL_REDIRECT=False
      - USE_HTTPS=true
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
      - ./keys:/app/keys
    command: >
            sh -c "python manage.py makemigrations &&
                   python manage.py migrate &&
                   echo 'from django.contrib.auth import get_user_model; User = get_user_model(); User.objects.filter(username=\"admin\").exists() or User.objects.create_superuser(\"admin\", \"admin@example.com\", \"admin\")' | python manage.py shell &&
                   if [ \"$$USE_HTTPS\" = \"true\" ] || [ \"$$USE_HTTPS\" = \"1\" ]; then
                     echo '=== Запуск в режиме HTTPS ===' &&
                     mkdir -p /app/keys &&
                     if [ ! -f /app/keys/cert.pem ] || [ ! -f /app/keys/key.pem ]; then
                       echo 'SSL сертификаты не найдены. Генерация...' &&
                       python /app/keys/generate_cert.py;
                     else
                       echo 'SSL сертификаты уже существуют.';
                     fi &&
                     echo 'Запуск Gunicorn на порту 8443 (HTTPS)...' &&
                     exec gunicorn --bind 0.0.0.0:8443 --keyfile /app/keys/key.pem --certfile /app/keys/cert.pem --workers 3 --timeout 120 wells_project.wsgi:application;
                   else
                     echo '=== Запуск в режиме HTTP ===' &&
                     echo 'Запуск Gunicorn на порту 8000 (HTTP)...' &&
                     exec gunicorn --bind 0.0.0.0:8000 --workers 3 --timeout 120 wells_project.wsgi:application;
                   fi"

volumes:
  postgres_data:
  minio_data:
  redis_data:
